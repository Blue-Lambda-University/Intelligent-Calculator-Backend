apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-api
  namespace: calculator-staging
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: calculator-api}
  template:
    metadata:
      labels: {app: calculator-api}
    spec:
      containers:
        - name: api
          image: ghcr.io/REPLACE_ORG/intelligent-calculator-api:REPLACE_TAG
          ports: [{containerPort: 8000}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: calculator-db, key: url}}
            - name: APP_ENV
              value: staging
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: calculator-api, namespace: calculator-staging}
spec:
  selector: {app: calculator-api}
  ports: [{port: 8000, targetPort: 8000}]
